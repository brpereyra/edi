name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            name: edi-linux-amd64
          - os: linux
            arch: arm64
            name: edi-linux-arm64
          - os: darwin
            arch: amd64
            name: edi-darwin-amd64
          - os: darwin
            arch: arm64
            name: edi-darwin-arm64
          - os: windows
            arch: amd64
            name: edi-windows-amd64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Build Binary
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v0.1.0"
          fi
          go build -ldflags="-s -w -X edi/internal/version.Version=${TAG}" -o "dist/${{ matrix.name }}" ./cmd/edi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh dist/
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v0.1.0"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "El release $TAG ya existe. Subiendo y actualizando binarios..."
            gh release upload "$TAG" dist/* --clobber
          else
            echo "Creando release $TAG y subiendo binarios..."
            gh release create "$TAG" dist/* \
              --title "edi $TAG" \
              --generate-notes
          fi

